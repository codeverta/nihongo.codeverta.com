name: Mobile update checks

on:
  push:
    branches: [main]
    paths:
      - 'lib/core/app_update/**'
      - 'lib/core/notifications/**'
      - 'test/core/notifications/**'
      - 'pubspec.*'
      - 'android/**/*.kts'
      - 'android/app/google-services.json'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'lib/main.dart'
      - 'test/core/app_update/**'
      - 'android/app/src/main/kotlin/**'
      - 'ios/Runner/AppDelegate.swift'
      - '.github/workflows/mobile-update-checks.yml'
  pull_request:
    paths:
      - 'lib/core/app_update/**'
      - 'lib/core/notifications/**'
      - 'test/core/notifications/**'
      - 'pubspec.*'
      - 'android/**/*.kts'
      - 'android/app/google-services.json'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'ios/Runner/Info.plist'
      - 'lib/main.dart'
      - 'test/core/app_update/**'
      - 'android/app/src/main/kotlin/**'
      - 'ios/Runner/AppDelegate.swift'
      - '.github/workflows/mobile-update-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/core/app_update lib/core/notifications lib/core/routing/app_router.dart lib/main.dart test/core/app_update test/core/notifications
      - run: flutter test test/core/app_update test/core/notifications test/widget_test.dart test/core/branding_test.dart
  ios-host:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS host without signing
        run: flutter build ios --simulator --debug --no-codesign
