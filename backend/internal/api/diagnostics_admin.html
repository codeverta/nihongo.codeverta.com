<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Error & Crash • Nihongo Master</title>
<style>body{font:16px system-ui;background:#f7f8fc;color:#202340;max-width:1200px;margin:30px auto;padding:20px}a{color:#34378c}input,select,button{font:inherit;padding:10px;margin:4px;border:1px solid #c8ccdc;border-radius:8px}button{cursor:pointer;background:#282b88;color:white;border:0}button:disabled{opacity:.55;cursor:wait}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{background:white;border:1px solid #dde0ed;border-radius:10px;padding:12px}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;border-bottom:1px solid #ddd;padding:12px;vertical-align:top}#table{overflow:auto}small{color:#596078}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:700px;background:#f4f5fa;padding:12px;border-radius:8px}.message{min-width:240px;overflow-wrap:anywhere}#status{min-height:24px}</style>
<p><a href="/admin">← Menu admin</a></p><h1>Crash & error</h1><p>Diagnostik aplikasi Flutter dan error backend. Laporan dikelompokkan berdasarkan error yang sama; jumlah kemunculan dan waktu terakhir tetap diperbarui.</p>
<form id="unlock"><label>Kunci admin <input id="key" type="password" autocomplete="off" required></label><button>Buka monitor</button></form>
<section id="panel" hidden><button id="lock">Kunci</button><div class="stats" id="stats"></div><form id="search"><label>Cari <input id="query" maxlength="120" placeholder="Jenis error, route, atau pesan"></label><label>Sumber <select id="source"><option value="">Semua</option><option value="flutter">Flutter</option><option value="backend">Backend</option></select></label><button>Cari</button><button type="button" id="refresh">Muat ulang</button></form><div id="table"><table><thead><tr><th>Terakhir terjadi</th><th>Sumber / jenis</th><th>Error</th><th>Route / status</th><th>Jumlah</th></tr></thead><tbody id="rows"></tbody></table></div><button id="prev">Sebelumnya</button><button id="next">Berikutnya</button></section>
<p id="status" role="status" aria-live="polite"></p>
<script>
let token='',page=1,total=0,busy=false;
const el=id=>document.getElementById(id),status=message=>el('status').textContent=message;
async function api(){const query=new URLSearchParams({page:String(page),q:el('query').value,source:el('source').value});const response=await fetch('/v1/admin/errors?'+query,{cache:'no-store',headers:{Authorization:'Bearer '+token}});const json=await response.json();if(!response.ok)throw Error(json.error?.message||'Permintaan gagal');return json.data}
function cell(row,value){const td=document.createElement('td');td.textContent=value??'';row.append(td);return td}
async function load(){if(busy)return;busy=true;status('Memuat…');try{const data=await api();total=data.total;el('rows').replaceChildren();for(const item of data.items){const row=document.createElement('tr');cell(row,new Date(item.lastSeenAt).toLocaleString('id-ID'));cell(row,item.source+' · '+item.severity+'\n'+item.errorType);const message=cell(row,'');message.className='message';message.textContent=item.message;const route=cell(row,item.method+' '+item.route+(item.statusCode?' · '+item.statusCode:''));if(item.stackTrace){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Stack trace';const pre=document.createElement('pre');pre.textContent=item.stackTrace;details.append(summary,pre);route.append(details)}cell(row,item.occurrences+' kali');el('rows').append(row)}const stats=data.stats;el('stats').replaceChildren();for(const [label,value] of [['Grup error',stats.errors],['Total kejadian',stats.occurrences],['Flutter',stats.flutter],['Backend',stats.backend]]){const item=document.createElement('span');item.textContent=label+': '+value;el('stats').append(item)}el('prev').disabled=page===1;el('next').disabled=page*50>=total;status(total+' grup error · halaman '+page)}catch(error){status(error.message);throw error}finally{busy=false}}
el('unlock').onsubmit=async event=>{event.preventDefault();token=el('key').value;try{await load();el('key').value='';el('unlock').hidden=true;el('panel').hidden=false}catch{token=''}};
el('lock').onclick=()=>{token='';el('rows').replaceChildren();el('panel').hidden=true;el('unlock').hidden=false;status('Terkunci.')};el('search').onsubmit=event=>{event.preventDefault();page=1;load().catch(()=>{})};el('refresh').onclick=()=>load().catch(()=>{});el('prev').onclick=()=>{page=Math.max(1,page-1);load().catch(()=>{})};el('next').onclick=()=>{page++;load().catch(()=>{})};
</script></html>
