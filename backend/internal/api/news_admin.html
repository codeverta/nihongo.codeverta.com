<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin News — Nihongo Master</title>
<style>body{font:16px system-ui;color:#202340;background:#f7f8fc;max-width:1100px;margin:auto;padding:24px}button,input,select{font:inherit;padding:9px;border:1px solid #bcc2d6;border-radius:8px}button{cursor:pointer;background:#292a87;color:white}button:disabled{opacity:.5}label{display:inline-block;margin:8px}input[type=text],input[type=password]{width:min(80vw,400px)}section,article{background:white;padding:20px;border:1px solid #e1e4ee;border-radius:14px;margin:16px 0}small{color:#535f76}a{color:#292a87}pre{white-space:pre-wrap}#status{white-space:pre-wrap}#editor{max-height:80vh;overflow:auto}.reading{width:130px!important}.tokens{display:flex;flex-wrap:wrap;gap:8px}.token{display:flex;flex-direction:column;padding:5px;background:#f4f5fb;border-radius:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}h2{font-size:22px}</style>
<p><a href="/admin/">← Admin Nihongo Master</a></p><h1>News</h1>
<form id="login"><label>Kunci admin <input id="key" type="password" required autocomplete="off"></label><button>Buka</button></form>
<p id="status" role="status"></p><main id="panel" hidden><button id="lock">Kunci kembali</button><h2>Sumber dan jadwal</h2><p>Hari: Minggu = 0 sampai Sabtu = 6. Maksimal dua hari per minggu. Zona waktu mengikuti nama IANA, misalnya Asia/Jakarta. Pemeriksaan tidak menjamin selalu ada artikel baru.</p><div id="sources"></div><h2>Artikel</h2><div class="toolbar"><select id="source"><option value="">Semua sumber</option><option value="global-voices">Global Voices</option><option value="osaka">Osaka City</option></select><button id="reload">Muat ulang status</button></div><div id="articles"></div><button id="previous">Sebelumnya</button> <span id="pages"></span> <button id="next">Berikutnya</button><section id="editor" hidden></section></main>
<script>
'use strict';let token='',page=1,current=null;const $=id=>document.getElementById(id);const say=s=>$('status').textContent=s;
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function button(text,fn){const b=el('button',text);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){say(e.message)}finally{b.disabled=false}};return b}
async function api(path,method='GET',body){const options={method,headers:{Authorization:'Bearer '+token}};if(body instanceof FormData)options.body=body;else if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const res=await fetch('/v1/admin/news'+path,options);if(res.status===204)return null;const json=await res.json();if(!res.ok)throw Error(json.error?.message||'Permintaan gagal');return json.data}
function field(parent,title,value,type='text'){const label=el('label',title+' '),input=el('input');input.type=type;input.value=value;label.append(input);parent.append(label);return input}
function date(value){return value?new Date(value).toLocaleString('id-ID'):'Belum pernah'}
async function load(){const data=await api('?page='+page+'&source='+encodeURIComponent($('source').value));$('sources').replaceChildren();for(const s of data.sources){const box=el('section');box.append(el('h3',s.name+' · '+s.status),el('p','Terakhir mulai: '+date(s.lastStartedAt)+' · Terakhir berhasil: '+date(s.lastSuccessAt)+' · Berikutnya: '+date(s.nextFetchAt)),el('p','Batch terakhir: '+s.lastImported+' artikel diproses; '+s.lastSkipped+' dilewati.'));if(s.lastError)box.append(el('pre',s.lastError));const days=field(box,'Hari',s.days.join(',')),hour=field(box,'Jam',s.hour,'number'),minute=field(box,'Menit',s.minute,'number'),zone=field(box,'Zona waktu',s.timezone),active=field(box,'Aktif','', 'checkbox');active.checked=s.enabled;box.append(button('Simpan jadwal',async()=>{await api('/sources/'+s.id,'PUT',{days:days.value.split(',').map(x=>Number(x.trim())),hour:Number(hour.value),minute:Number(minute.value),timezone:zone.value,enabled:active.checked});say('Jadwal tersimpan.');await load()}),button('Fetch sekarang',async()=>{await api('/sources/'+s.id+'/fetch','POST');say('Permintaan diterima. Muat ulang status untuk melihat hasil; proses dapat memerlukan beberapa menit.');setTimeout(()=>load().catch(e=>say(e.message)),3000)}));$('sources').append(box)}$('articles').replaceChildren();for(const a of data.items){const box=el('article');box.append(el('h3',a.title),el('small',a.sourceName+' · '+date(a.publishedAt)+(a.hidden?' · Disembunyikan':'')),el('p',a.summary),button('Edit artikel / furigana',()=>edit(a.id)));$('articles').append(box)}$('pages').textContent='Halaman '+page+' · '+data.total+' artikel';$('previous').disabled=page===1;$('next').disabled=page*data.pageSize>=data.total}
async function edit(id){current=await api('/'+id);const a=current,box=$('editor');box.replaceChildren(el('h2',a.title),el('p','Koreksi furigana hanya mengubah bacaan. Teks sumber tetap dipertahankan. Kosongkan bacaan untuk menyembunyikan ruby token tersebut.'));box.hidden=false;const link=el('a','Sumber asli');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';box.append(link);const hidden=field(box,'Sembunyikan','', 'checkbox');hidden.checked=a.hidden;const image=field(box,'URL gambar tersimpan',a.imageUrl||''),credit=field(box,'Kredit gambar',a.imageCredit||''),license=field(box,'Lisensi / izin gambar',a.imageLicense||'');const file=field(box,'Unggah gambar milik sendiri/berizin','', 'file');file.accept='image/png,image/jpeg';box.append(button('Unggah PNG/JPEG',async()=>{if(!file.files[0])throw Error('Pilih gambar terlebih dahulu.');const form=new FormData();form.append('file',file.files[0]);image.value=(await api('/images','POST',form)).url;say('Gambar diunggah. Isi kredit dan lisensinya, lalu simpan artikel.')}));const changes=[];for(const [p,tokens,text] of [[-1,a.titleTokens,a.title],...a.paragraphs.map((v,i)=>[i,v.tokens,v.text])]){box.append(el('p',text));const row=el('div');row.className='tokens';for(const [i,t] of tokens.entries()){if(!/[\u3400-\u9fff\u{20000}-\u{323af}]/u.test(t.surface))continue;const cell=el('div');cell.className='token';cell.append(el('span',t.surface));const reading=field(cell,t.readingSource,t.reading||'');reading.className='reading';reading.onchange=()=>{const prior=changes.find(x=>x.paragraph===p&&x.token===i);if(prior)prior.reading=reading.value;else changes.push({paragraph:p,token:i,reading:reading.value})};row.append(cell)}box.append(row)}box.append(button('Simpan artikel',async()=>{await api('/'+id,'PUT',{hidden:hidden.checked,imageUrl:image.value,imageCredit:credit.value,imageLicense:license.value,revision:a.revision,readings:changes});say('Artikel tersimpan.');await load();await edit(id)}),button('Hapus artikel',async()=>{if(!confirm('Hapus artikel ini? URL akan tetap ditandai agar tidak terbit ulang saat fetch.'))return;await api('/'+id,'DELETE');box.hidden=true;say('Artikel dihapus.');await load()}),button('Tutup editor',()=>{box.hidden=true}));box.scrollIntoView({behavior:'smooth'})}
$('login').onsubmit=async e=>{e.preventDefault();token=$('key').value;try{await load();$('panel').hidden=false;$('login').hidden=true;$('key').value='';say('Admin News terbuka.')}catch(e){token='';say(e.message)}};$('lock').onclick=()=>{token='';current=null;$('panel').hidden=true;$('login').hidden=false;$('editor').replaceChildren();$('articles').replaceChildren();$('sources').replaceChildren();say('Terkunci.')};$('reload').onclick=()=>load().catch(e=>say(e.message));$('source').onchange=()=>{page=1;load().catch(e=>say(e.message))};$('previous').onclick=()=>{page--;load().catch(e=>say(e.message))};$('next').onclick=()=>{page++;load().catch(e=>say(e.message))};
</script></html>
