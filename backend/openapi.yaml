        id: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        bestScore: {type: integer}
        completed: {type: boolean}
        imageUrl: {type: string}
        words: {type: array, items: {$ref: '#/components/schemas/VocabularyWord'}}
    VocabularyQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: {type: string}
        prompt: {type: string}
        kind: {type: string}
        imageAsset: {type: string}
        imageUrl: {type: string}
        imagePanel: {type: integer, minimum: 0, maximum: 7}
        imageDescription: {type: string}
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
    HomeBanner:
      type: object
      required: [id, title, description, imageUrl, action, buttonLabel, order, enabled]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9-]{0,63}$'}
        title: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 180}
        imageUrl: {type: string, maxLength: 2048, description: HTTPS URL or root-relative bundled/uploaded image URL; empty uses the app illustration}
        action: {type: string, enum: [learn, ssw, jobs]}
        buttonLabel: {type: string, minLength: 1, maxLength: 40}
        order: {type: integer, minimum: 0, maximum: 999}
        enabled: {type: boolean}
    HomeBannerConfig:
      type: object
      required: [banners]
      properties:
        banners: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/HomeBanner'}}
    Dashboard:
      type: object
      required: [isAuthenticated, dailyGoal, categories, tracks, exams, plans, achievements, banners]
      properties:
        banners: {type: array, items: {$ref: '#/components/schemas/HomeBanner'}, description: Enabled banners sorted by order}
        isAuthenticated: {type: boolean}
        profile: {$ref: '#/components/schemas/Profile'}
        dailyGoal: {$ref: '#/components/schemas/DailyGoal'}
        categories: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
        tracks: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
        exams: {type: array, items: {$ref: '#/components/schemas/Exam'}}
        plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Profile:
      type: object
      required: [id, displayName, email, target, level, xp, streakDays, entitlement]
      properties:
        id: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        photoUrl: {type: string, format: uri}
        target: {type: string}
        level: {type: integer}
        xp: {type: integer}
        streakDays: {type: integer}
        entitlement:
          type: object
          properties:
            tier: {type: string, enum: [free, premium]}
            isLifetime: {type: boolean}
            expiresAt: {type: string, format: date-time}
    DailyGoal:
      type: object
      required: [minutesLearned, targetMinutes, streakDays]
      properties:
        minutesLearned: {type: integer, minimum: 0}
        targetMinutes: {type: integer, minimum: 0}
        streakDays: {type: integer, minimum: 0}
    LearningCategory:
      type: object
      required: [id, name, description, lessonCount, requiredTier]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        lessonCount: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    LearningTrack:
      type: object
      required: [id, system, level, title, description, progress, requiredTier]
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        requiredTier: {type: string, enum: [free, premium]}
    Exam:
      type: object
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        questionCount: {type: integer}
        durationMinutes: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    Plan:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        billingType: {type: string, enum: [free, monthly, yearly, lifetime]}
        priceIdr: {type: integer}
        features: {type: array, items: {type: string}}
        recommended: {type: boolean}
    PricingConfig:
      type: object
      required: [lifetimePriceIdr]
      properties:
        lifetimePriceIdr: {type: integer, minimum: 1000, maximum: 100000000, example: 149000}
    GamificationSummary:
      type: object
      required: [xp, level, levelXp, nextLevelXp, streakDays, bestStreak, lessonsCompleted, examsCompleted, activeDays, minutesToday, timezone, achievements]
      properties:
        xp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        levelXp: {type: integer, minimum: 0, maximum: 499}
        nextLevelXp: {type: integer, const: 500}
        streakDays: {type: integer, minimum: 0}
        bestStreak: {type: integer, minimum: 0}
        lessonsCompleted: {type: integer, minimum: 0}
        examsCompleted: {type: integer, minimum: 0, description: Distinct exam IDs completed with at least one answer}
        activeDays: {type: integer, minimum: 0}
        minutesToday: {type: integer, minimum: 0, description: Capped server duration of completed quiz or exam sessions}
        timezone: {type: string, const: Asia/Jakarta}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Achievement:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        icon: {type: string}
        progress: {type: integer}
        target: {type: integer}
        unlockedAt: {type: string, format: date-time}
    CategoriesResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
    TracksResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
    ExamsResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Exam'}}
    PlansResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Plan'}}
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
