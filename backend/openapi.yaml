          required: [points]
          properties:
            points:
              type: array
              items: {$ref: '#/components/schemas/GrammarPoint'}
    GrammarPoint:
      type: object
      required: [pattern, meaning, formation, explanation, commonMistake, examples]
      properties:
        pattern: {type: string}
        meaning: {type: string}
        formation: {type: string}
        explanation: {type: string}
        commonMistake: {type: string}
        examples:
          type: array
          items:
            type: object
            required: [japanese, reading, meaning]
            properties:
              japanese: {type: string}
              reading: {type: string}
              meaning: {type: string}
    GrammarAttempt:
      type: object
      required: [id, lessonId, startedAt, questions]
      properties:
        id: {type: string}
        lessonId: {type: string}
        startedAt: {type: string, format: date-time}
        questions:
          type: array
          items:
            type: object
            required: [id, prompt, options]
            properties:
              id: {type: string}
              prompt: {type: string}
              options:
                type: array
                items:
                  type: object
