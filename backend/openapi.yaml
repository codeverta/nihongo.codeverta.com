      type: object
      required: [questionId, correct, correctOptionId, explanation]
      properties:
        questionId: {type: string}
        correct: {type: boolean}
        correctOptionId: {type: string}
        explanation: {type: string}
    ReadingResult:
      type: object
      required: [attemptId, lessonId, score, correctAnswers, totalQuestions, passed, bestScore, progress, canRetry]
      properties:
        attemptId: {type: string}
        lessonId: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        correctAnswers: {type: integer, minimum: 0}
        totalQuestions: {type: integer, minimum: 1}
        passed: {type: boolean}
        bestScore: {type: integer, minimum: 0, maximum: 100}
        progress: {type: integer, minimum: 0, maximum: 100}
        canRetry: {type: boolean}
    VocabularyLevel:
      type: object
      required: [level, title, description, requiredTier, progress, lessons]
      properties:
        level: {type: string, enum: [N5, N4, N3, N2, N1]}
        title: {type: string}
        description: {type: string}
        requiredTier: {type: string, enum: [free, premium]}
        progress: {type: integer, minimum: 0, maximum: 100}
        lessons:
          type: array
          items: {$ref: '#/components/schemas/VocabularyLessonSummary'}
    VocabularyLessonSummary:
      type: object
      required: [id, order, title, description, wordCount, bestScore, completed]
      properties:
        id: {type: string}
        order: {type: integer, minimum: 1}
        title: {type: string}
        description: {type: string}
        wordCount: {type: integer, minimum: 1}
        questionCount: {type: integer, minimum: 1}
        imageAsset: {type: string}
        imageUrl: {type: string, description: Absolute CDN URL or path relative to API origin}
        bestScore: {type: integer, minimum: 0, maximum: 100}
        completed: {type: boolean}
    VocabularyExample:
      type: object
      required: [japanese, reading, meaning]
      properties:
        japanese: {type: string}
        reading: {type: string, description: Full kana reading of the sentence}
        meaning: {type: string}
    VocabularyWord:
      type: object
      required: [id, term, reading, meaning, example, exampleMeaning, note]
      properties:
        id: {type: string}
        term: {type: string}
        reading: {type: string}
        meaning: {type: string}
        example: {type: string, description: Legacy first example}
        exampleMeaning: {type: string}
        examples: {type: array, items: {$ref: '#/components/schemas/VocabularyExample'}}
        note: {type: string}
        imageAsset: {type: string}
        imageUrl: {type: string}
        imagePanel: {type: integer, minimum: 0, maximum: 7, description: Row-major panel in a 4-column by 2-row sheet}
        imageDescription: {type: string}
    VocabularyLesson:
      type: object
      required: [id, level, title, description, bestScore, completed, words]
      properties:
        id: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        bestScore: {type: integer}
        completed: {type: boolean}
        imageUrl: {type: string}
        words: {type: array, items: {$ref: '#/components/schemas/VocabularyWord'}}
    VocabularyQuestion:
      type: object
      required: [id, prompt, options]
      properties:
        id: {type: string}
        prompt: {type: string}
        kind: {type: string}
        imageAsset: {type: string}
        imageUrl: {type: string}
        imagePanel: {type: integer, minimum: 0, maximum: 7}
        imageDescription: {type: string}
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
    Dashboard:
      type: object
      required: [isAuthenticated, dailyGoal, categories, tracks, exams, plans, achievements]
      properties:
        isAuthenticated: {type: boolean}
        profile: {$ref: '#/components/schemas/Profile'}
        dailyGoal: {$ref: '#/components/schemas/DailyGoal'}
        categories: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
        tracks: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
        exams: {type: array, items: {$ref: '#/components/schemas/Exam'}}
        plans: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Profile:
      type: object
      required: [id, displayName, email, target, level, xp, streakDays, entitlement]
      properties:
        id: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        photoUrl: {type: string, format: uri}
        target: {type: string}
        level: {type: integer}
        xp: {type: integer}
        streakDays: {type: integer}
        entitlement:
          type: object
          properties:
            tier: {type: string, enum: [free, premium]}
            isLifetime: {type: boolean}
            expiresAt: {type: string, format: date-time}
    DailyGoal:
      type: object
      required: [minutesLearned, targetMinutes, streakDays]
      properties:
        minutesLearned: {type: integer, minimum: 0}
        targetMinutes: {type: integer, minimum: 0}
        streakDays: {type: integer, minimum: 0}
    LearningCategory:
      type: object
      required: [id, name, description, lessonCount, requiredTier]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        lessonCount: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    LearningTrack:
      type: object
      required: [id, system, level, title, description, progress, requiredTier]
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        description: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        requiredTier: {type: string, enum: [free, premium]}
    Exam:
      type: object
      properties:
        id: {type: string}
        system: {type: string}
        level: {type: string}
        title: {type: string}
        questionCount: {type: integer}
        durationMinutes: {type: integer}
        requiredTier: {type: string, enum: [free, premium]}
    Plan:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        billingType: {type: string, enum: [free, monthly, yearly, lifetime]}
        priceIdr: {type: integer}
        features: {type: array, items: {type: string}}
        recommended: {type: boolean}
    GamificationSummary:
      type: object
      required: [xp, level, levelXp, nextLevelXp, streakDays, bestStreak, lessonsCompleted, examsCompleted, activeDays, minutesToday, timezone, achievements]
      properties:
        xp: {type: integer, minimum: 0}
        level: {type: integer, minimum: 1}
        levelXp: {type: integer, minimum: 0, maximum: 499}
        nextLevelXp: {type: integer, const: 500}
        streakDays: {type: integer, minimum: 0}
        bestStreak: {type: integer, minimum: 0}
        lessonsCompleted: {type: integer, minimum: 0}
        examsCompleted: {type: integer, minimum: 0, description: Distinct exam IDs completed with at least one answer}
        activeDays: {type: integer, minimum: 0}
        minutesToday: {type: integer, minimum: 0, description: Capped server duration of completed quiz or exam sessions}
        timezone: {type: string, const: Asia/Jakarta}
        achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
    Achievement:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        icon: {type: string}
        progress: {type: integer}
        target: {type: integer}
        unlockedAt: {type: string, format: date-time}
    CategoriesResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningCategory'}}
    TracksResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/LearningTrack'}}
    ExamsResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Exam'}}
    PlansResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Plan'}}
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
