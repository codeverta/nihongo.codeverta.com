openapi: 3.1.0
info:
  title: Nihongo Master API
  version: 1.0.0
  description: Contract for the Nihongo Master mobile application.
servers:
  - url: http://localhost:8080/v1
    description: Local development
paths:
  /manga:
    get:
      security: [{bearerAuth: []}]
      description: Requires an active verified lifetime entitlement.
      summary: Curated Japanese manga catalog read exclusively from MariaDB
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 40, default: 20}}
        - {in: query, name: q, schema: {type: string, maxLength: 100}}
        - {in: query, name: genre, schema: {type: string, maxLength: 50}}
      responses:
        '401': {description: Missing, invalid or revoked session}
        '402': {description: Lifetime Access required}
        '200': {description: 'Stored items, total, page, pageSize, sourceName, sourceUrl, cacheEnabled. Cover URLs use application COS/CDN.'}
        '400': {description: Invalid filter or pagination}
        '503': {description: Database unavailable}
  /manga/{id}:
    get:
      security: [{bearerAuth: []}]
      description: Requires an active verified lifetime entitlement.
      summary: Stored series detail and ordered chapter metadata with source attribution
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '401': {description: Missing, invalid or revoked session}
        '402': {description: Lifetime Access required}
        '200': {description: 'Series metadata and chapters. Japanese panels are not translated. Does not fetch upstream.'}
        '404': {description: Missing, disabled or blocked title}
  /manga/chapters/{id}:
    get:
      security: [{bearerAuth: []}]
      description: Requires an active verified lifetime entitlement.
      summary: Stored chapter status; COS pages are returned only after complete import
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '401': {description: Missing, invalid or revoked session}
        '402': {description: Lifetime Access required}
        '200': {description: 'Chapter with status, sourceUrl, retryAt, fetchedAt and pages [{index,url,width,height}]. Never hotlinks upstream images.'}
        '404': {description: Chapter missing or parent title hidden}
  /manga/chapters/{id}/prepare:
    post:
      security: [{bearerAuth: []}]
      description: Requires an active verified lifetime entitlement.
      summary: Idempotently queue an existing chapter without making an upstream request
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '401': {description: Missing, invalid or revoked session}
        '402': {description: Lifetime Access required}
        '200': {description: Already cached or in failed-attempt cooldown}
        '202': {description: Queued or currently processing; poll stored status after 15 seconds}
        '404': {description: Missing or hidden chapter}
        '429': {description: Shared bounded queue is full}
        '503': {description: MariaDB or COS configuration unavailable}
  /admin/manga:
    get:
      summary: Manga editorial catalog, durable weekly deadlines and COS configuration status
      security: [{adminBearerAuth: []}]
      responses:
        '200': {description: Stored catalog, including hidden titles}
        '401': {description: Invalid or unconfigured admin key}
  /admin/manga/series:
    post:
      summary: Add a reviewed Rawkuma series or immediately hide it; never bypass fetch deadlines
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceUrl, enabled]
              properties:
                sourceUrl: {type: string, format: uri}
                enabled: {type: boolean}
                japaneseVerified: {type: boolean}
                nonAdultReviewed: {type: boolean}
      responses:
        '200': {description: Editorial settings persisted}
        '400': {description: URL is outside the supported source or enabled title lacks editorial review}
        '401': {description: Invalid or unconfigured admin key}
  /news:
    get:
      summary: Public database-only news catalog; never fetches publishers on reads
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {in: query, name: source, schema: {type: string, enum: [global-voices, osaka]}}
      responses:
        '200': {description: 'data contains items (metadata and title tokens), total, page, pageSize, sources with synchronization timestamps'}
        '400': {description: Invalid pagination or source}
        '503': {description: Database unavailable; no publisher fallback}
  /news/{id}:
    get:
      summary: Public stored article with credits, licensing and UTF-16 paragraph tokens
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Article with titleTokens and paragraphs [{text, kind, tokens}], credits, references, publishedAt UTC, originalDate in the publisher Japanese calendar, dateType, fetchedAt, license and change notice. Images include backend-local imageUrl, imageCredit, imageLicense, imageSourceUrl and imageLicenseUrl. Tokens contain start/end UTF-16 offsets, surface/base/reading/readingSource.'}
        '404': {description: Missing, hidden or deleted article}
        '503': {description: Database unavailable}
  /admin/news:
    get:
      summary: List all stored articles and private source fetch statuses
      security: [{adminBearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: source, schema: {type: string, enum: [global-voices, osaka]}}
      responses:
        '200': {description: Includes hidden articles and source errors}
        '401': {description: Invalid or unconfigured news admin key}
  /admin/news/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Read stored article including hidden articles for editing
      security: [{adminBearerAuth: []}]
      responses:
        '200': {description: Stored article including editable ruby tokens}
        '404': {description: Missing or deleted article}
    put:
      summary: Save visibility, uploaded image metadata and selected token reading corrections
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: {type: boolean}
                revision: {type: string, description: Revision from article GET; required when editing readings to reject stale token positions}
                imageUrl: {type: string, description: Empty or existing /news-images/hash.png or jpg}
                imageCredit: {type: string, maxLength: 8000}
                imageLicense: {type: string, maxLength: 200}
                readings:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [paragraph, token, reading]
                    properties:
                      paragraph: {type: integer, minimum: -1, description: '-1 for title; otherwise paragraph index'}
                      token: {type: integer, minimum: 0}
                      reading: {type: string, maxLength: 100}
      responses:
        '200': {description: Saved without modifying source text}
        '400': {description: Invalid token or image metadata}
        '409': {description: Source article changed since the editor loaded its token positions}
        '404': {description: Missing article}
    delete:
      summary: Delete article body and retain URL tombstone to prevent reimport
      security: [{adminBearerAuth: []}]
      responses:
        '204': {description: Deleted}
        '404': {description: Missing article}
  /admin/news/sources/{id}:
    put:
      summary: Persist calendar schedule for a fixed supported source
      security: [{adminBearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, enum: [global-voices, osaka]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone, days, hour, minute, enabled]
              properties:
                timezone: {type: string, example: Asia/Jakarta}
                days: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: integer, minimum: 0, maximum: 6}}
                hour: {type: integer, minimum: 0, maximum: 23}
                minute: {type: integer, minimum: 0, maximum: 59}
                enabled: {type: boolean}
      responses:
        '200': {description: Schedule saved in MariaDB}
        '400': {description: Invalid zone or schedule}
  /admin/news/sources/{id}/fetch:
    post:
      summary: Request background import, preserving previous articles on failure
      security: [{adminBearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, enum: [global-voices, osaka]}}
      responses:
        '202': {description: Request accepted; inspect source status after completion}
        '409': {description: Source is running or within the one-minute manual cooldown}
        '404': {description: Unsupported source}
  /admin/news/images:
    post:
      summary: Upload a licensed or owned PNG/JPEG to persistent backend storage
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Stored /news-images/hash.png or jpg URL; credit/license required when assigning it to an article}
        '400': {description: Invalid file, over 5 MiB or over 4096 pixels per dimension}
  /admin/notifications:
    get:
      summary: List private announcement drafts/history and sender configuration state (admin bearer key)
      responses:
        '200': {description: Announcement history; requires NOTIFICATIONS_ADMIN_TOKEN or branding admin key}
        '401': {description: Invalid admin key}
    post:
      summary: Save an announcement draft without sending it (admin bearer key)
      responses:
        '201': {description: Draft saved with generated ID}
        '401': {description: Invalid admin key}
        '422': {description: Invalid title/body/allowed internal route or oversized topic message}
  /admin/notifications/{id}:
    put:
      summary: Edit a draft or explicitly reopen a definitively rejected message (admin bearer key)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft saved}
        '409': {description: Sent or uncertain message cannot be edited or retried}
  /admin/notifications/{id}/send:
    post:
      summary: Dispatch a saved draft once to the public Nihongo announcement topic
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmId]
              properties:
                confirmId: {type: string, description: Must match the saved draft ID}
      responses:
        '200': {description: Persisted result (sent, failed, or uncertain); sent means FCM acceptance, not device receipt}
        '409': {description: Message already processed; duplicate dispatch blocked}
        '503': {description: FCM sender not configured}
  /admin/notifications/check:
    post:
      summary: Validate FCM access without sending a notification (validate_only)
      responses:
        '200': {description: Sender validated; no broadcast sent}
        '502': {description: Firebase rejected validation or connection failed}
        '503': {description: FCM sender not configured}

  /app-update-policy:
    get:
      tags: [App updates]
      summary: Get public Android and iOS minimum build and OS requirements before login
      security: []
      responses:
        '200':
          description: 'data.android and data.ios contain enabled, minimumBuild (0 disables forced updates), latestBuild, latestVersion, minimumAndroidApi, minimumIOSVersion, storeUrl, unsupportedDevicePolicy (allow/block), message. Cache-Control no-store.'
  /admin/app-update-policy:
    put:
      tags: [App updates]
      summary: Save durable update requirements; requires APP_UPDATE_ADMIN_TOKEN or the configured branding admin token
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [android, ios]
              properties:
                android: {type: object}
                ios: {type: object}
      responses:
        '200': {description: Validated policy saved atomically and applied immediately}
        '401': {description: Invalid or disabled admin token}
        '422': {description: Invalid minimum build, OS version, or platform-specific store URL}
        '500': {description: Policy could not be saved; previous policy remains active}
  /admin/pricing:
    get:
      tags: [Subscription]
      summary: Load configured in-app display price (admin bearer key)
      security: [{adminBearerAuth: []}]
      responses:
        '200': {description: Current IDR display price}
        '401': {description: Invalid or disabled admin token}
    put:
      tags: [Subscription]
      summary: Save durable lifetime display price; store-console prices remain manual
      security: [{adminBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PricingConfig'}
      responses:
        '200': {description: Price saved and applied immediately}
        '401': {description: Invalid or disabled admin token}
        '422': {description: 'Price must be between IDR 1,000 and 100,000,000'}
        '500': {description: Price could not be saved; previous price remains active}
  /pricing:
    get:
      tags: [Subscription]
      summary: Get the current lifetime display price in IDR
      security: []
      responses:
        '200': {description: Public pricing configuration; Cache-Control no-store}
  /dictionary/search:
    get:
      tags: [Dictionary]
      summary: Search free Japanese-English dictionary via Jisho
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: mode, in: query, schema: {type: string, enum: [auto, japanese, english], default: auto}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 1}}
        - {name: jlpt, in: query, schema: {type: string, enum: [N5, N4, N3, N2, N1]}}
        - {name: common, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: 'data contains query, page, hasMore, entries (original Jisho entry objects), source'}
        '400': {description: Invalid query or filter}
        '503': {description: External source busy or unavailable}
  /admin/dictionary:
    get:
      tags: [Dictionary]
      summary: List permanent cached searches and process cache counters
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
      responses:
        '200': {description: 'data contains items, total, page, pageSize (50), stats; effective modes include japanese, english, raw, kanji'}
        '401': {description: Invalid dictionary admin token}
        '503': {description: Database unavailable}
  /admin/dictionary/{id}/refresh:
    post:
      tags: [Dictionary]
      summary: Atomically refresh one cached response while preserving old data on failure
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Refreshed successfully}
        '400': {description: Legacy response without refresh metadata}
        '401': {description: Invalid dictionary admin token}
        '404': {description: Cache record not found}
        '503': {description: Refresh failed; old response retained}
  /dictionary/kanji/{character}:
    get:
      tags: [Dictionary]
      summary: Get kanji readings and meanings from kanjiapi.dev
      security: []
      parameters:
        - {name: character, in: path, required: true, schema: {type: string}, description: One Han character}
      responses:
        '200': {description: data contains a kanjiapi.dev kanji object; JLPT classification uses legacy levels}
        '400': {description: Invalid character}
        '404': {description: Kanji not found}
        '503': {description: External source busy or unavailable}
  /billing:
    get:
      tags: [Billing]
      summary: Get lifetime product ID, opaque account binding, configured platforms and verified entitlement
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Billing account includes configured display priceIdr; final checkout price comes from the store}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Store revalidation unavailable}
  /billing/verify:
    post:
      tags: [Billing]
      summary: Verify one-time lifetime purchase with Google Play or App Store and bind one app account
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, verificationData]
              properties:
                platform: {type: string, enum: [android, ios]}
                productId: {type: string, example: nihongo_master_lifetime}
                verificationData: {type: string, description: Google purchase token or Apple StoreKit 2 signed JWS}
                transactionId: {type: string}
      responses:
        '200': {description: Verified purchased or revoked state and current entitlement}
        '202': {description: Pending payment; no entitlement granted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Transaction belongs to another active app account}
        '422': {description: Invalid proof, product, platform, or account binding}
        '503': {description: Store verifier unavailable; retry without repurchasing}
  /billing/notifications/google:
    post:
      tags: [Billing]
      summary: Receive authenticated Google Pub/Sub RTDN; re-fetch authoritative store state
      responses:
        '204': {description: Notification processed}
        '401': {description: Invalid Pub/Sub OIDC audience or service account identity}
        '503': {description: Temporary store failure; Pub/Sub should retry}
  /billing/notifications/apple:
    post:
      tags: [Billing]
      summary: Receive App Store Server Notifications V2 with verified Apple signedPayload
      responses:
        '204': {description: Notification processed}
        '422': {description: Invalid signed notification}
        '503': {description: Temporary store failure; Apple should retry}
  /me/account:
    delete:
      tags: [Profile]
      summary: Permanently delete account and personal learning data; detach purchase for legitimate store restore
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [DELETE]}
      responses:
        '204': {description: Account deleted and sessions revoked; does not request store refund}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Missing explicit confirmation}
  /assets/images/onboarding-japanese-journey.webp:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Assets]
      summary: Public onboarding artwork
      responses:
        '200':
          description: WebP image; cached for one day
          content:
            image/webp:
              schema: {type: string, format: binary}
        '404':
          description: Image unavailable
  /assets/images/{category}/{filename}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Assets]
      summary: Public learning image served outside the mobile bundle
      parameters:
        - in: path
          name: category
          required: true
          schema: {type: string, enum: [reading, vocabulary]}
        - in: path
          name: filename
          required: true
          schema: {type: string, pattern: '\.webp$'}
      responses:
        '200':
          description: WebP image; cached for one day
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          description: Image unavailable or path disallowed
  /simulation/n5:
    get:
      tags: [Simulation]
      summary: N5 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 21 vocabulary items plus 17 grammar items, no dokkai/listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 38}
                      durationMinutes: {type: integer, const: 40}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/n4:
    get:
      tags: [Simulation]
      summary: N4 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 28 vocabulary items (25 minutes) plus 21 grammar and 8 reading items (55 minutes), no listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 57}
                      durationMinutes: {type: integer, const: 80}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/n3:
    get:
      tags: [Simulation]
      summary: N3 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 35 vocabulary items (30 minutes) plus 23 grammar and 16 reading items (70 minutes), no listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 74}
                      durationMinutes: {type: integer, const: 100}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/nat:
    get:
      tags: [Simulation]
      summary: NAT 5Q Exam 1 written practice overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 43 original written items; vocabulary (21 questions, 20 minutes) then grammar and reading (22 questions, 40 minutes); listening excluded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 43}
                      durationMinutes: {type: integer, const: 60}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '402': {description: Lifetime Access required}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/{level}:
    get:
      tags: [Simulation]
      summary: Simulation overview for a supported exam level, including NAT/JFT Exam 2–5 and data-driven SSW papers
      security: [{bearerAuth: []}]
      parameters:
        - {name: level, in: path, required: true, description: Use NAT-2 through NAT-5 for additional NAT 5Q papers, or JFT, JFT-2, JFT-3, JFT-4 or JFT-5 for original written practice papers., schema: {type: string, example: NAT-2}}
      responses:
        '200':
          description: Paper overview with section timers, question count, active attempt, history, and omitted content. Each NAT 5Q paper has 43 original written questions and a 60-minute timer; each JFT paper has 36 original written questions and a shared 45-minute timer. Listening is omitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string, description: SSW titles identify original learning simulations and scope limits}
                      questionCount: {type: integer}
                      durationMinutes: {type: integer}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Premium access required for simulation}
        '404': {description: Unsupported level}
  /ssw/{sector}/practice:
    get:
      tags: [SSW]
      summary: Original SSW study questions for a sector and optional module
      description: Requires premium access. Question keys and explanations are withheld until answer checking.
      security: [{bearerAuth: []}]
      parameters:
        - {name: sector, in: path, required: true, schema: {type: string}}
        - {name: module, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Practice questions for the requested sector/module
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      questions:
                        type: array
                        items:
                          type: object
                          required: [id, moduleId, group, lessonId, prompt, options]
                          properties:
                            id: {type: string}
                            moduleId: {type: string}
                            group: {type: string}
                            lessonId: {type: string}
                            prompt: {type: string}
                            options: {type: array, minItems: 4, maxItems: 4, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Premium access required for practice}
        '404': {description: Sector or module not found}
  /ssw/{sector}/practice/check:
    post:
      tags: [SSW]
      summary: Check a response and return feedback for an original SSW practice question
      security: [{bearerAuth: []}]
      parameters:
        - {name: sector, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId: {type: string}
                answer: {type: integer, minimum: 0, maximum: 3}
      responses:
        '200':
          description: Correctness, answer index, explanation, and related lesson
