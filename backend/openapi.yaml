              reading: {type: string}
              meaning: {type: string}
    GrammarAttempt:
      type: object
      required: [id, lessonId, startedAt, questions]
      properties:
        id: {type: string}
        lessonId: {type: string}
        startedAt: {type: string, format: date-time}
        questions:
          type: array
          items:
            type: object
