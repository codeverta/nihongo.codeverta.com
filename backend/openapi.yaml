components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque-session-token}
  parameters:
    System:
      in: query
      name: system
      schema: {type: string, enum: [JLPT, NAT, JFT]}
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: {type: string}
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: {type: string}
  responses:
    AuthSession:
      description: Authenticated session
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  token: {type: string}
                  user: {$ref: '#/components/schemas/Profile'}
    Profile:
      description: User profile
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/Profile'}
    Categories:
      description: Learning categories
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CategoriesResponse'}
    Tracks:
      description: Learning tracks
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TracksResponse'}
    Exams:
      description: Exams
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ExamsResponse'}
    Plans:
      description: Subscription plans
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlansResponse'}
    Unauthorized:
      description: Missing, invalid, or revoked token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PremiumRequired:
      description: Premium entitlement required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    SimulationSection:
      type: object
      required: [id, name, durationSeconds, questionCount]
      properties:
        id: {type: string, enum: [vocabulary, grammar, conversation, reading]}
        name: {type: string}
        durationSeconds: {type: integer, const: 1200}
        questionCount: {type: integer}
    SimulationQuestion:
      type: object
      required: [id, number, section, group, instructions, prompt, options]
      properties:
        id: {type: string}
        number: {type: integer, minimum: 1, maximum: 38}
        section: {type: string, enum: [vocabulary, grammar, conversation, reading]}
        group: {type: string}
        instructions: {type: string}
        passage: {type: string}
        prompt: {type: string, description: 'Tested words wrapped in [[...]] are displayed underlined'}
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            properties:
              id: {type: string, description: Opaque random ID with no correct-answer pattern}
              text: {type: string}
    SimulationSession:
      type: object
      required: [attempt, paperId, activeSection, sectionStartedAt, expiresAt, serverTime, sections, questions, answers, marked]
      properties:
        attempt:
          type: object
          properties:
            id: {type: string}
            examId: {type: string, description: "Simulation IDs include jlpt-n5-simulation-1, jlpt-n4-simulation-1 and jlpt-n3-simulation-1, jft-a2-full-1 and nat-5q-full-1"}
            userId: {type: string}
            status: {type: string, enum: [in_progress, completed]}
            startedAt: {type: string, format: date-time}
        paperId: {type: string}
        activeSection: {type: string, enum: [vocabulary, grammar, conversation, reading, completed]}
        sectionStartedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        serverTime: {type: string, format: date-time}
        sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
        questions: {type: array, items: {$ref: '#/components/schemas/SimulationQuestion'}}
        answers: {type: object, additionalProperties: {type: string}}
        marked: {type: array, items: {type: string}}
        result: {$ref: '#/components/schemas/SimulationResult'}
    SimulationResult:
      type: object
      required: [attemptId, paperId, score, correct, total, answered, durationSeconds, completedAt, sections, reviews, scoringNote]
      properties:
        attemptId: {type: string}
        paperId: {type: string}
        score: {type: integer, minimum: 0, maximum: 100, description: Raw accuracy percentage rounded down; not an official scaled score}
        correct: {type: integer}
        total: {type: integer, const: 38}
        answered: {type: integer}
        durationSeconds: {type: integer}
        completedAt: {type: string, format: date-time}
        scoringNote: {type: string}
        sections:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              correct: {type: integer}
              total: {type: integer}
              score: {type: integer}
        reviews:
          type: array
          items:
            type: object
            properties:
              question: {$ref: '#/components/schemas/SimulationQuestion'}
              selectedOptionId: {type: string}
              correctOptionId: {type: string}
              correct: {type: boolean}
              explanation: {type: string}
    Branding:
      type: object
      required: [appName, tagline, iconUrl, splashUrl, backgroundColor]
      properties:
        appName: {type: string, minLength: 1, maxLength: 50}
        tagline: {type: string, maxLength: 120}
        iconUrl: {type: string, description: Public HTTPS PNG/JPG URL or empty for default}
        splashUrl: {type: string, description: Public HTTPS portrait PNG/JPG URL or empty for default}
        backgroundColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$', example: '#FAFAFA'}
    DiagnosticQuestion:
      type: object
      required: [id, section, prompt, options]
      properties:
        id: {type: string}
        section: {type: string, enum: [Kosakata, Kanji, Grammar, Reading]}
        passage: {type: string}
        prompt: {type: string}
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [id, text]
            properties:
              id: {type: string}
              text: {type: string}
    DiagnosticSession:
      type: object
      required: [attempt, expiresAt, serverTime, questions, answers]
      properties:
        attempt:
          type: object
          properties:
            id: {type: string}
            examId: {type: string, description: "Simulation IDs include jlpt-n5-simulation-1, jlpt-n4-simulation-1 and jlpt-n3-simulation-1, jft-a2-full-1 and nat-5q-full-1"}
            userId: {type: string}
            status: {type: string, enum: [in_progress, completed]}
            startedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        serverTime: {type: string, format: date-time}
        questions: {type: array, items: {$ref: '#/components/schemas/DiagnosticQuestion'}}
        answers: {type: object, additionalProperties: {type: string}}
        result: {$ref: '#/components/schemas/DiagnosticResult'}
    DiagnosticResult:
      type: object
      required: [attemptId, score, correct, total, answered, completedAt, durationSeconds, sections, reviews]
      properties:
        attemptId: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        correct: {type: integer}
        total: {type: integer}
        answered: {type: integer}
        completedAt: {type: string, format: date-time}
        durationSeconds: {type: integer, minimum: 0, maximum: 1800}
        sections:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              correct: {type: integer}
              total: {type: integer}
              score: {type: integer, minimum: 0, maximum: 100}
        reviews:
          type: array
          items:
            type: object
            properties:
              question: {$ref: '#/components/schemas/DiagnosticQuestion'}
              selectedOptionId: {type: string}
              correctOptionId: {type: string}
              correct: {type: boolean}
              explanation: {type: string}
    GrammarLessonSummary:
      type: object
      required: [id, order, chapter, title, pointCount, questionCount, bestScore, completed]
      properties:
        id: {type: string, example: grammar-n5-01}
        level: {type: string, enum: [N5, N4, N3, N2]}
        patterns: {type: array, items: {type: string}}
        order: {type: integer, minimum: 1}
        chapter: {type: string}
        title: {type: string}
        pointCount: {type: integer, minimum: 1}
        questionCount: {type: integer, minimum: 1}
        bestScore: {type: integer, minimum: 0, maximum: 100}
        completed: {type: boolean}
    GrammarCourse:
      type: object
      required: [level, title, progress, completedLessons, lessons]
      properties:
        level: {type: string, enum: [N5, N4, N3, N2]}
        title: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        completedLessons: {type: integer, minimum: 0}
        lessons:
          type: array
          items: {$ref: '#/components/schemas/GrammarLessonSummary'}
    GrammarLesson:
      allOf:
