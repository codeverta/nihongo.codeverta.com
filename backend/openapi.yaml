openapi: 3.1.0
info:
  title: Nihongo Master API
  version: 1.0.0
  description: Contract for the Nihongo Master mobile application.
servers:
  - url: http://localhost:8080/v1
    description: Local development
paths:
  /dictionary/search:
    get:
      tags: [Dictionary]
      summary: Search free Japanese-English dictionary via Jisho
      security: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 100}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 1}}
        - {name: jlpt, in: query, schema: {type: string, enum: [N5, N4, N3, N2, N1]}}
        - {name: common, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: 'data contains query, page, hasMore, entries (original Jisho entry objects), source'}
        '400': {description: Invalid query or filter}
        '503': {description: External source busy or unavailable}
  /dictionary/kanji/{character}:
    get:
      tags: [Dictionary]
      summary: Get kanji readings and meanings from kanjiapi.dev
      security: []
      parameters:
        - {name: character, in: path, required: true, schema: {type: string}, description: One Han character}
      responses:
        '200': {description: data contains a kanjiapi.dev kanji object; JLPT classification uses legacy levels}
        '400': {description: Invalid character}
        '404': {description: Kanji not found}
        '503': {description: External source busy or unavailable}
  /billing:
    get:
      tags: [Billing]
      summary: Get lifetime product ID, opaque account binding, configured platforms and verified entitlement
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Billing account; priceIdr is 99000, final localized price comes from store}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Store revalidation unavailable}
  /billing/verify:
    post:
      tags: [Billing]
      summary: Verify one-time lifetime purchase with Google Play or App Store and bind one app account
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, productId, verificationData]
              properties:
                platform: {type: string, enum: [android, ios]}
                productId: {type: string, example: nihongo_master_lifetime}
                verificationData: {type: string, description: Google purchase token or Apple StoreKit 2 signed JWS}
                transactionId: {type: string}
      responses:
        '200': {description: Verified purchased or revoked state and current entitlement}
        '202': {description: Pending payment; no entitlement granted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {description: Transaction belongs to another active app account}
        '422': {description: Invalid proof, product, platform, or account binding}
        '503': {description: Store verifier unavailable; retry without repurchasing}
  /billing/notifications/google:
    post:
      tags: [Billing]
      summary: Receive authenticated Google Pub/Sub RTDN; re-fetch authoritative store state
      responses:
        '204': {description: Notification processed}
        '401': {description: Invalid Pub/Sub OIDC audience or service account identity}
        '503': {description: Temporary store failure; Pub/Sub should retry}
  /billing/notifications/apple:
    post:
      tags: [Billing]
      summary: Receive App Store Server Notifications V2 with verified Apple signedPayload
      responses:
        '204': {description: Notification processed}
        '422': {description: Invalid signed notification}
        '503': {description: Temporary store failure; Apple should retry}
  /me/account:
    delete:
      tags: [Profile]
      summary: Permanently delete account and personal learning data; detach purchase for legitimate store restore
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [DELETE]}
      responses:
        '204': {description: Account deleted and sessions revoked; does not request store refund}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Missing explicit confirmation}
  /assets/images/onboarding-japanese-journey.png:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Assets]
      summary: Public onboarding artwork
      responses:
        '200':
          description: PNG image; cached for one day
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          description: Image unavailable
  /assets/images/{category}/{filename}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [Assets]
      summary: Public learning image served outside the mobile bundle
      parameters:
        - in: path
          name: category
          required: true
          schema: {type: string, enum: [reading, vocabulary]}
        - in: path
          name: filename
          required: true
          schema: {type: string, pattern: '\.png$'}
      responses:
        '200':
          description: PNG image; cached for one day
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          description: Image unavailable or path disallowed
  /simulation/n5:
    get:
      tags: [Simulation]
      summary: N5 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 21 vocabulary items plus 17 grammar items, no dokkai/listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 38}
                      durationMinutes: {type: integer, const: 40}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/n4:
    get:
      tags: [Simulation]
      summary: N4 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 28 vocabulary items (25 minutes) plus 21 grammar and 8 reading items (55 minutes), no listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 57}
                      durationMinutes: {type: integer, const: 80}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/n3:
    get:
      tags: [Simulation]
      summary: N3 language simulation overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Original paper, 35 vocabulary items (30 minutes) plus 23 grammar and 16 reading items (70 minutes), no listening
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 74}
                      durationMinutes: {type: integer, const: 100}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/nat:
    get:
      tags: [Simulation]
      summary: NAT 5Q Exam 1 written practice overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 43 original written items; vocabulary (21 questions, 20 minutes) then grammar and reading (22 questions, 40 minutes); listening excluded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 43}
                      durationMinutes: {type: integer, const: 60}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '402': {description: Lifetime Access required}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/jft:
    get:
      tags: [Simulation]
      summary: JFT Exam 1 written practice overview, active attempt and latest ten results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 36 original written items across vocabulary, conversation/expression and reading; one shared 45-minute deadline, listening excluded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sharedTimer: {type: boolean, const: true}
                      paperId: {type: string}
                      title: {type: string}
                      questionCount: {type: integer, const: 36}
                      durationMinutes: {type: integer, const: 45}
                      sections: {type: array, items: {$ref: '#/components/schemas/SimulationSection'}}
                      activeAttemptId: {type: string}
                      omittedSections: {type: array, items: {type: string}}
                      history: {type: array, items: {type: object}}
        '402': {description: Lifetime Access required}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /simulation/attempts/{attemptID}:
    parameters:
      - {name: attemptID, in: path, required: true, schema: {type: string}}
    get:
      tags: [Simulation]
      summary: Resume owned simulation; expired sections advance at their original deadline
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Only active-section questions and answers until final completion; no answer key while active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SimulationSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown or not owned}
  /simulation/attempts/{attemptID}/answers:
    parameters:
      - {name: attemptID, in: path, required: true, schema: {type: string}}
    put:
      tags: [Simulation]
      summary: Save active-section answer and review flag; empty optionId clears the answer
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, optionId, marked]
              properties:
                questionId: {type: string}
                optionId: {type: string}
                marked: {type: boolean}
      responses:
        '200': {description: Saved, without correctness feedback}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown or not owned}
        '422': {description: Closed section, expired session or invalid option}
  /simulation/attempts/{attemptID}/submit-section:
    parameters:
      - {name: attemptID, in: path, required: true, schema: {type: string}}
    post:
      tags: [Simulation]
      summary: Lock expected section; vocabulary starts grammar immediately; retries are idempotent
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section]
              properties:
                section: {type: string, enum: [vocabulary, grammar, conversation, reading]}
      responses:
        '200':
          description: Updated session; result and reviews only after grammar finishes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SimulationSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown or not owned}
        '422': {description: Invalid section or trying to skip vocabulary}
  /branding:
    get:
      tags: [Branding]
      summary: Public application branding (empty image URLs use bundled defaults)
      responses:
        '200':
          description: Branding settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Branding'}
  /admin/branding:
    put:
      tags: [Branding]
      summary: Replace durable branding using BRANDING_ADMIN_TOKEN (not a user session)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Branding'}
      responses:
        '200': {description: Settings saved}
        '401': {description: Missing or incorrect admin token}
        '422': {description: Invalid name, image URL or color}
        '500': {description: Settings could not be persisted}
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/google:
    post:
      tags: [Authentication]
      summary: Exchange a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: {type: string}
      responses:
        '200': {$ref: '#/components/responses/AuthSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Authentication]
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /home:
    get:
      tags: [Home]
      summary: Get the complete home dashboard
      description: A valid optional bearer token adds personal profile, daily goal, and achievements.
      security: [{}, {bearerAuth: []}]
      responses:
        '200':
          description: Guest or authenticated dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Dashboard'}
  /learning/categories:
    get:
      tags: [Learning]
      responses:
        '200': {$ref: '#/components/responses/Categories'}
  /learning/tracks:
    get:
      tags: [Learning]
      parameters:
        - {$ref: '#/components/parameters/System'}
      responses:
        '200': {$ref: '#/components/responses/Tracks'}
  /exams:
    get:
      tags: [Exams]
      parameters:
        - {$ref: '#/components/parameters/System'}
      responses:
        '200': {$ref: '#/components/responses/Exams'}
  /exam-attempts:
    post:
      tags: [Exams]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [examId]
              properties:
                examId: {type: string, description: "Simulation IDs include jlpt-n5-simulation-1, jlpt-n4-simulation-1 and jlpt-n3-simulation-1, jft-a2-full-1 and nat-5q-full-1"}
      responses:
        '201': {description: Exam attempt created}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402': {$ref: '#/components/responses/PremiumRequired'}
  /diagnostic/n5:
    get:
      tags: [Exams]
      summary: N5 diagnostic metadata, active attempt and up to ten completed results
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Diagnostic overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      exam: {$ref: '#/components/schemas/Exam'}
                      sectionCounts: {type: object, additionalProperties: {type: integer}}
                      activeAttemptId: {type: string}
                      history: {type: array, items: {$ref: '#/components/schemas/DiagnosticResult'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /exam-attempts/{attemptID}:
    get:
      tags: [Exams]
      summary: Restore an owned N5 diagnostic session without exposing answer keys
      security: [{bearerAuth: []}]
      parameters:
        - {name: attemptID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Session with questions, saved answers, serverTime, expiresAt and optional completed result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Attempt not found or belongs to another account}
  /exam-attempts/{attemptID}/answers:
    put:
      tags: [Exams]
      summary: Save or replace a selected answer before the server deadline
      security: [{bearerAuth: []}]
      parameters:
        - {name: attemptID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, optionId]
              properties:
                questionId: {type: string}
                optionId: {type: string}
      responses:
        '200': {description: Answer saved without revealing correctness}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Attempt not found or belongs to another account}
        '422': {description: Invalid question or option, expired deadline, or already completed session}
  /exam-attempts/{attemptID}/complete:
    post:
      tags: [Exams]
      summary: Grade saved answers, count blanks as incorrect and return an idempotent result
      security: [{bearerAuth: []}]
      parameters:
        - {name: attemptID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Percentage, section scores and answer reviews; not official JLPT scoring
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DiagnosticResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Attempt not found or belongs to another account}
  /plans:
    get:
      tags: [Subscription]
      responses:
        '200': {$ref: '#/components/responses/Plans'}
  /me/profile:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Profile]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, target]
              properties:
                displayName: {type: string}
                target: {type: string, example: JLPT N3}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/progress:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Lesson progress list}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/progress/{lessonId}:
    put:
      tags: [Profile]
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: lessonId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completion, lastPosition]
              properties:
                completion: {type: integer, minimum: 0, maximum: 100}
                lastPosition: {type: integer, minimum: 0}
      responses:
        '200': {description: Progress saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/gamification:
    get:
      tags: [Profile]
      summary: Server-verified XP, level, Jakarta daily streak, and permanent achievements
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current account summary; fresh accounts have zero XP and locked achievements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/GamificationSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/achievements:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Achievement list}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /vocabulary/levels:
    get:
      tags: [Vocabulary]
      summary: List JLPT N5-N1 vocabulary levels, lessons, and user progress
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Vocabulary course catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/VocabularyLevel'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /vocabulary/lessons/{lessonId}:
    get:
      tags: [Vocabulary]
      summary: Get teaching content for a vocabulary lesson
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '200':
          description: Lesson and vocabulary words
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/VocabularyLesson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Lesson not found}
  /vocabulary/lessons/{lessonId}/attempts:
    post:
      tags: [Vocabulary]
      summary: Start or retry a server-evaluated lesson quiz
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '201':
          description: New attempt with questions; correct answers are withheld
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, lessonId, questions, startedAt]
                    properties:
                      id: {type: string}
                      lessonId: {type: string}
                      startedAt: {type: string, format: date-time}
                      questions: {type: array, items: {$ref: '#/components/schemas/VocabularyQuestion'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Lesson not found}
  /vocabulary/attempts/{attemptId}/answers:
    post:
      tags: [Vocabulary]
      summary: Submit one answer and receive educational feedback
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AttemptId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, optionId]
              properties:
                questionId: {type: string}
                optionId: {type: string}
      responses:
        '200':
          description: Correctness, correct option, and explanation
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Attempt not found or not owned by user}
        '422': {description: Invalid question or option}
  /vocabulary/attempts/{attemptId}/complete:
    post:
      tags: [Vocabulary]
      summary: Complete an attempt and persist best score/progress
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AttemptId'}
      responses:
        '200':
          description: Score, pass status, best score, and total progress
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Attempt not found or not owned by user}
        '422': {description: Not all questions have been answered}
  /grammar/course:
    get:
      tags: [Grammar]
      summary: Get an N5, N4, N3, or N2 grammar curriculum and signed-in user's completion progress
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: level
          schema: {type: string, enum: [N5, N4, N3, N2], default: N5}
      responses:
        '200':
          description: Grammar course
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/GrammarCourse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Unsupported grammar level; supported levels are N5, N4, N3, and N2}
  /grammar/lessons/{lessonId}:
    get:
      tags: [Grammar]
      summary: Get grammar explanations and examples without quiz answers
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '200':
          description: Grammar lesson
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/GrammarLesson'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Lesson not found}
  /grammar/lessons/{lessonId}/attempts:
    post:
      tags: [Grammar]
      summary: Start a new five-question quiz; correct answers withheld
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/LessonId'}
      responses:
        '201':
          description: Quiz attempt
          content:
            application/json:
              schema:
                type: object
