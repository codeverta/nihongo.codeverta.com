name: nihongo_master
description: "Nihongo Master - Aplikasi Pembelajaran Bahasa Jepang modern dengan Clean Feature-First Architecture."
publish_to: 'none'
version: 2.0.2+11

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  connectivity_plus: ^7.3.2
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_analytics: ^12.1.0
  google_mobile_ads: ^9.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.1.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  in_app_review: ^2.0.10
  in_app_purchase: 3.3.1
  path_provider: ^2.1.6
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.2
  url_launcher: 6.3.2
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  audioplayers: ^6.8.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    - assets/images/exams/
    - assets/images/ssw/
    - assets/images/jobs/
    - assets/images/explore/
    - assets/map/
    - assets/content/ssw/
    - assets/content/ssw/en/
    - assets/images/app-icon-small.webp
    - backend/assets/images/vocabulary/
