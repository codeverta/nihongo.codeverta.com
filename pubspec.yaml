name: nihongo_master
description: "Nihongo Master - Aplikasi Pembelajaran Bahasa Jepang modern dengan Clean Feature-First Architecture."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.17
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  in_app_purchase: 3.3.1
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.2
  url_launcher: 6.3.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.4
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/exams/
    - assets/images/ssw/
    - assets/content/ssw/
    - assets/images/app-icon-small.png
